option.audio_volume_level.name=音频音量级别
option.audio_volume_level.descr=主音量控制（0-100%）。
option.play_ambient_sounds.name=播放环境音效
option.play_ambient_sounds.descr=启用后，类似风声或滴水的环境音效会偶尔播放。
option.preload_ambient_sounds.name=预加载环境音效
option.preload_ambient_sounds.descr=在游戏启动时加载全部环境音效，否则在首次播放时逐个加载（此时可能会有轻微延迟）。
option.audio_buffer_size.name=音频缓冲大小
option.audio_buffer_size.descr=较低的值会降低延迟，但在 CPU 较慢的设备上可能导致声音破裂（音频缓冲欠载）。提高此值可获得更平滑的声音，但会增加声音延迟。
option.input_mode.name=输入模式
option.input_mode.descr=可以使用以下输入模式：\n\n{COLOR_LIGHT_WHITE}默认：{color_reset} 数字小键盘或方向键\n\n{COLOR_LIGHT_WHITE}Vi 键：{color_reset} hjkl 用于正交移动，yubn 用于斜向移动。\n\n{COLOR_LIGHT_WHITE}手柄支持：{color_reset} 适用于例如将手柄摇杆绑定到小键盘 8 个方向键的情况。移动需要用 [Enter] 键确认。仅按 [Enter] 会执行等待命令。\n\n有关输入的更多信息请参阅游戏手册。
option.input_mode.standard=默认
option.input_mode.vi_keys=Vi 键
option.input_mode.controller_support=手柄支持
option.double_click_fullscreen.name=双击全屏
option.double_click_fullscreen.descr=双击任意位置切换全屏？
option.always_center_view.name=始终居中视图
option.always_center_view.descr=将视图始终保持在玩家身上，否则仅在玩家接近视图边缘时才居中。
option.use_tile_set.name=使用瓦片集
option.use_tile_set.descr=使用瓦片图形表示游戏环境，否则仅使用文本符号。
option.font.name=字体
option.font.descr=用于文本的字体。
option.fullscreen.name=全屏
option.fullscreen.descr=以全屏模式（无边框全屏窗口）或可调整大小窗口运行。也可以按 Alt-Enter 切换。
option.hardware_acceleration.name=使用硬件加速
option.hardware_acceleration.descr=使用自动选择（优先尝试硬件加速，否则使用软件回退），或强制使用软件渲染器。如果你遇到图形问题，将此选项设为“Software”可能有帮助。
option.hardware_acceleration.auto_select=自动选择
option.hardware_acceleration.software=软件
option.video_scale_factor.name=视频缩放倍数
option.video_scale_factor.descr=按此倍数缩放所有图形。
option.brightness.name=亮度
option.brightness.descr=调整颜色亮度。
option.text_mode_wall_symbol.name=文本模式墙符号
option.text_mode_wall_symbol.descr=用于表示文本模式中的墙体符号（未使用瓦片时）。
option.text_mode_wall_symbol.filled_rectangle=实心矩形
option.text_mode_wall_symbol.hash_sign=井号
option.display_health_bars.name=显示生命条
option.display_health_bars.descr=在生物未满血时在其下方显示生命条。
option.use_trap_color_when_obscured.name=遮挡时使用陷阱颜色
option.use_trap_color_when_obscured.descr=如果陷阱被其他物体（例如物品）遮住，则使用该陷阱类型的颜色作为背景色，以表明下方有陷阱；否则无论陷阱类型都使用相同的背景色。
option.base_delay.name=基础动画延迟（毫秒）
option.base_delay.descr=动画的基础延迟因子（毫秒）。数值越高，投射物或爆炸等动画播放越慢。
option.language.name=语言
option.language.descr=用于菜单、提示和本地化消息文件的语言。缺失的翻译将回退到英文。
