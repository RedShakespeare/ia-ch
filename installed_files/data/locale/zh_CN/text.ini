option.language.name=语言
option.language.descr=用于菜单、提示和本地化文本文件的语言。缺失的翻译将回退到英文。
option.base_delay.name=基础动画延迟（毫秒）
option.base_delay.descr=动画的基础延迟因子（毫秒）。数值越高，投射物和爆炸等动画播放越慢。
option.skip_intro_level.name=跳过开场关卡
option.skip_intro_level.descr=跳过开场关卡。该关卡仅用于交代背景并营造氛围，通关它并不会获得物品或经验值等奖励。
option.skip_intro_popup.name=跳过开场剧情提示
option.skip_intro_popup.descr=跳过开场关卡中的剧情提示。
option.any_key_confirm_more.name=任意键继续
option.any_key_confirm_more.descr=任意键都可以确认消息记录中的“更多”提示（例如当怪物出现并向玩家发出警告时）。否则只有空格键（以及少数其他按键）可以确认这些提示。保留此选项关闭更安全。
option.auto_select_menu.name=自动选择菜单项
option.auto_select_menu.descr=如果关闭，在菜单中按字母键只会跳转到对应位置，必须再次按键或回车才能选中该项（这只适用于带说明文字的菜单，例如特质选择菜单）。如果启用，按下字母会立即选择该项。
option.display_hints.name=显示提示
option.display_hints.descr=控制游戏提示的显示时机。{COLOR_LIGHT_WHITE}每局一次：{color_reset}在每次游戏会话中显示所有提示一次（并会在其他会话中再次显示）。{COLOR_LIGHT_WHITE}一次：{color_reset}在所有游戏会话中每条提示只显示一次。{COLOR_LIGHT_WHITE}从不：{color_reset}完全禁用提示。
option.display_hints.once_per_game=每局一次
option.display_hints.once=一次
option.display_hints.never=从不
option.always_warn_monster.name=总是警告怪物出现
option.always_warn_monster.descr=当有怪物出现在视野中时总是警告（且没有其他怪物已被看见），否则只在进行长动作时警告，例如处理伤口。
option.warn_throw_valuable.name=投掷贵重物品时警告
option.warn_throw_valuable.descr=在投掷诸如药水之类的“贵重”物品前进行警告。
option.warn_light_explosives.name=点燃爆炸物时警告
option.warn_light_explosives.descr=在点燃爆炸物前进行警告。
option.warn_drink_malign_potion.name=饮用恶性药水时警告
option.warn_drink_malign_potion.descr=在饮用已知为恶性的药水前进行警告。
option.warn_ranged_weapon_melee.name=近战使用远程武器时警告
option.warn_ranged_weapon_melee.descr=如果试图用远程武器（例如手枪）进行近战攻击，则发出警告；这种操作虽然可行，但可能并非本意。
option.medical_bag_auto_choice.name=自动选择医疗包
option.medical_bag_auto_choice.descr=按以下优先级自动选择医疗包动作：1）治疗感染 2）治疗伤口 3）快速包扎。如果关闭此选项，则会在弹出菜单中选择动作。
option.auto_reload_weapons.name=自动装填武器
option.auto_reload_weapons.descr=如果试图在没有装填弹药的情况下开火，则自动执行装填动作。
