hints.title_prefix=提示：
hints.altars.title=祭坛
hints.altars.body=站在祭坛上时，所有法术都会以更高等级施放——这包括从手稿和记忆中施放的法术。
hints.fountains.title=喷泉
hints.fountains.body=从喷泉饮水通常会恢复少量生命、精神和震惊值（但它们有时也会产生其他效果，有好有坏！）。喷泉可以饮用多次，但每次都有机会永久干涸。
hints.destroying_corpses.title=摧毁尸体
hints.destroying_corpses.body=可以按 [k] 或 [w] 摧毁尸体。这在对付某些类型的怪物时非常有用。有些武器，例如砍刀，会让摧毁尸体更容易——查看物品描述即可知道武器是否有这种加成。此外，一根位置合适的炸药或燃烧瓶通常也是阻止顽固怪物的有效方法。
hints.unload_weapons.title=卸下武器
hints.unload_weapons.body=可以按 [u] 或 [G] 卸下地上火器中的弹药。
hints.infected.title=感染
hints.infected.body=感染应尽快治疗。常见做法是使用医疗包。这只需要少量回合和资源，但如果操作被打断，努力就会白费（不过打断时不会损失医疗资源）。\n\n未经治疗的感染最终会变成疾病（最大生命值降低 50%），只能通过特殊手段移除，例如饮用某些药水。
hints.overburdened.title=负重过重
hints.overburdened.body=携带过多重量会让移动耗时加倍。这是非常危险且不利的情况。
hints.high_shock.title=高度震惊
hints.high_shock.body=处于极端精神震惊（压力、偏执）状态会导致理智受损。降低震惊的一种方式是寻找光源，例如激活电提灯或点燃照明棒，这可以避免或延缓理智受损。
hints.status_effects.title=状态效果
hints.status_effects.body=一个状态效果已经生效。状态效果是施加在生物身上的各种正面、负面或中性效果。例如混乱、燃烧、隐形或电击抗性。普通游戏画面会显示一份简略的活动状态效果列表。\n\n在角色画面中（按 [C] 或 [@] 进入），可以看到更详细的列表，包括每个效果的描述。\n\n以大写字母显示的状态效果是“永久”的，只有采取某些特殊行动才会移除，例如使用医疗包治疗伤口。
hints.study_inscription.title=铭文
hints.study_inscription.body=这里有一段铭文，研究它会获得一些经验。\n\n它也可能让你回忆起遗忘的法术，或揭示携带的手稿或药水的信息。携带的未知物品越多，揭示这些物品信息的机会越高。
hints.kick_brazier.title=踢倒火盆
hints.kick_brazier.body=可以踢倒火盆，在小范围内点燃生物。
hints.kick_statue.title=踢倒雕像
hints.kick_statue.body=可以踢倒雕像，伤害并击晕另一侧的生物。
hints.temporary_and_permanent_shock.title=临时和永久精神震惊
hints.temporary_and_permanent_shock.body=有些情况会造成“临时”精神震惊，当情况改变时它会被移除。例如进入黑暗区域或站在血迹旁边会让你的震惊值飙升，直到你离开。\n\n站在明亮光线中同样会降低你的震惊值，直到你回到地下环境的昏暗之中。\n\n看见怪物、施放法术、花费时间等会造成“永久”震惊，它不会消失，直到抵达下一层、震惊达到 100% 导致疯狂上升，或通过某种方式治愈震惊。
