player_bon.background.exorcist.destroy_sacred_tools_descr=不能使用手稿、祭坛、独石或锣，而是通过摧毁它们获得经验和热忱（手稿会在拾取时被摧毁）。热忱可用于施放法术；当精神点不足以施放时，会自动消耗这些点数。
player_bon.background.exorcist.holy_symbol_descr=开局携带一个圣符，可恢复精神点，并赋予对精神震惊和恐惧的抗性。
