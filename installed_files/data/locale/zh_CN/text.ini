player_bon.background.flagellant.no_damage_shock_descr=因受伤而受到的精神震惊为零。
player_bon.background.flagellant.moribund_descr=因受到伤害而生命值降至 6 点或以下时，会获得濒死状态 5-7 回合（+3 近战伤害、+30% 近战命中率、+3 护甲点）。
player_bon.background.flagellant.torture_collar_descr=佩戴无法取下的苦刑项圈；行走需要额外回合，潜行和闪避降低 20%。然而，佩戴项圈会让鞭笞者对肉体痛苦更加麻木，护甲增加 3 点。
player_bon.background.flagellant.blood_upgrade_levels_prefix=专精于鲜血领域法术。在角色等级
player_bon.background.flagellant.blood_upgrade_levels_and_separator=和
player_bon.background.flagellant.blood_upgrade_levels_suffix=时，该领域的所有法术都以更高技能等级施放。
